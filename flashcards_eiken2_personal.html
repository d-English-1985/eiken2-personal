<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2級個人用 フラッシュカード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: #1e1e24;
    background-image: radial-gradient(circle at 20% 10%, #2a2a35 0%, #1a1a20 70%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    color: #ff9a3c;
    margin-bottom: 6px;
    text-align: center;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #c8c8d0;
    margin-bottom: 20px;
    text-align: center;
    font-size: 14px;
  }
  .progress {
    color: #ffd28a;
    font-size: 18px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .progress-bar {
    width: 100%;
    max-width: 600px;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff9a3c 0%, #6bcb77 100%);
    transition: width 0.3s;
    width: 5%;
  }
  .card {
    width: 100%;
    max-width: 600px;
    min-height: 430px;
    background: #fafafa;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px solid #ff9a3c;
    margin-bottom: 18px;
    cursor: pointer;
    position: relative;
    transition: background 0.3s, border-color 0.3s;
  }
  .card.back {
    background: #fff8ee;
    border-color: #6bcb77;
    justify-content: flex-start;
    padding-top: 32px;
  }
  .face-front, .face-back {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .face-back { display: none; }
  .card.back .face-front { display: none; }
  .card.back .face-back { display: flex; }
  .word {
    font-size: 40px;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 8px;
    word-break: break-word;
    text-align: center;
    width: 100%;
  }
  .phonetic {
    font-size: 20px;
    color: #e67e22;
    margin-bottom: 12px;
    font-weight: 500;
    text-align: center;
    width: 100%;
  }
  .pos {
    font-size: 13px;
    color: #555;
    font-style: italic;
    background: #ececec;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .tap-hint {
    margin-top: 18px;
    font-size: 13px;
    color: #888;
    text-align: center;
    width: 100%;
  }
  .meaning {
    font-size: 28px;
    color: #c0392b;
    font-weight: 700;
    margin-bottom: 18px;
    width: 100%;
    text-align: center;
  }
  .example-label {
    font-size: 12px;
    color: #27ae60;
    margin-bottom: 6px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    width: 100%;
    text-align: left;
  }
  .example {
    font-size: 15px;
    color: #2c3e50;
    line-height: 1.6;
    background: white;
    padding: 14px;
    border-radius: 10px;
    border-left: 4px solid #27ae60;
    margin-bottom: 10px;
    text-align: left;
    width: 100%;
  }
  .example-jp {
    font-size: 13px;
    color: #444;
    line-height: 1.5;
    text-align: left;
    width: 100%;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
    width: 100%;
  }
  .btn {
    padding: 10px 22px;
    border-radius: 22px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid;
    transition: background 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn-orange { background: #ff7e3c; color: #fff; border-color: #d35400; }
  .btn-orange:active { background: #d35400; }
  .btn-green { background: #27ae60; color: #fff; border-color: #1e8449; }
  .btn-green:active { background: #1e8449; }
  .btn-white { background: #fff; color: #1e1e24; border-color: #fff; }
  .btn-white:active { background: #e0e0e0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .speed-control {
    background: white;
    padding: 7px 14px;
    border-radius: 22px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #2c3e50;
    font-weight: 500;
    border: 2px solid #d35400;
  }
  .speed-control select {
    border: 2px solid #ff7e3c;
    border-radius: 15px;
    padding: 3px 8px;
    font-size: 13px;
    background: white;
    cursor: pointer;
    font-weight: 700;
    color: #d35400;
    outline: none;
    font-family: inherit;
  }
  .nav-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .nav-btn {
    padding: 12px 28px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    border: 2px solid;
    transition: background 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .list-toggle {
    display: block;
    margin: 18px auto 0;
    padding: 9px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    background: #ff7e3c;
    color: #fff;
    border: 2px solid #d35400;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .list-toggle:active { background: #d35400; }
  .word-list {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    max-width: 600px;
    width: 100%;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    border: 2px solid #ff9a3c;
  }
  .word-list.show { display: block; }
  .list-item {
    padding: 10px 12px;
    border-bottom: 1px solid #e8e8e8;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 14px;
  }
  .list-item:active { background: #fff8ee; }
  .list-item.current { background: #fff0e0; font-weight: 700; border-left: 4px solid #ff7e3c; }
  .list-num { color: #d35400; min-width: 28px; font-weight: 700; }
  .list-word { flex: 1; color: #2c3e50; }
  .list-meaning { color: #1e8449; font-size: 13px; font-weight: 500; }
  
  @media (max-width: 480px) {
    .word { font-size: 32px; }
    .meaning { font-size: 22px; }
    .example { font-size: 14px; }
    .nav-btn { padding: 10px 20px; font-size: 14px; }
  }
</style>
</head>
<body>
  <h1>2級個人用 フラッシュカード</h1>
  <div class="subtitle">英検2級レベル 重要単語・熟語28選</div>
  
  <div class="progress" id="progress">1 / 28</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  
  <div class="card" id="card">
    <div class="face-front">
      <div class="word" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="pos" id="pos"></div>
      <div class="controls">
        <button type="button" class="btn btn-orange" id="playWord">🔊 単語を再生</button>
        <span class="speed-control">速度
          <select id="speedSelect">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
        </span>
      </div>
      <div class="tap-hint">👆 タップで意味を表示</div>
    </div>
    <div class="face-back">
      <div class="meaning" id="meaning"></div>
      <div class="example-label">📖 例文</div>
      <div class="example" id="example"></div>
      <div class="example-jp" id="exampleJp"></div>
      <div class="controls">
        <button type="button" class="btn btn-green" id="playExample">🔊 例文を再生</button>
      </div>
    </div>
  </div>
  
  <div class="nav-controls">
    <button type="button" class="nav-btn btn-white" id="prevBtn">← 前へ</button>
    <button type="button" class="nav-btn btn-orange" id="shuffleBtn">🔀 シャッフル</button>
    <button type="button" class="nav-btn btn-green" id="resetBtn">🔄 リセット</button>
    <button type="button" class="nav-btn btn-white" id="nextBtn">次へ →</button>
  </div>
  
  <button type="button" class="list-toggle" id="listToggle">📋 単語一覧を表示</button>
  
  <div class="word-list" id="wordList"></div>

<script>
(function() {
  var original = [
    { word: "as a result", phonetic: "/æz ə rɪˈzʌlt/", pos: "接続詞 (conjunction)", meaning: "結果として、その結果", example: "He studied hard. As a result, he passed the exam.", exampleJp: "彼は一生懸命勉強した。その結果、彼は試験に合格した。" },
    { word: "however", phonetic: "/haʊˈevər/", pos: "副詞 (adverb)", meaning: "しかしながら、どんなに〜でも", example: "It was raining. However, we went out for a walk.", exampleJp: "雨が降っていた。しかし私たちは散歩に出かけた。" },
    { word: "environment", phonetic: "/ɪnˈvaɪrənmənt/", pos: "名詞 (noun)", meaning: "環境、状況", example: "We must protect the environment.", exampleJp: "私たちは環境を守らなければなりません。" },
    { word: "reduce", phonetic: "/rɪˈduːs/", pos: "動詞 (verb)", meaning: "〜を減らす、縮小する", example: "We need to reduce the amount of plastic we use.", exampleJp: "私たちは使うプラスチックの量を減らす必要があります。" },
    { word: "instead", phonetic: "/ɪnˈsted/", pos: "副詞 (adverb)", meaning: "代わりに、その代わり", example: "I don't want coffee. I'll have tea instead.", exampleJp: "コーヒーは要りません。代わりに紅茶をいただきます。" },
    { word: "in order to", phonetic: "/ɪn ˈɔːrdər tuː/", pos: "熟語 (phrase)", meaning: "〜するために、〜の目的で", example: "She studies hard in order to become a doctor.", exampleJp: "彼女は医者になるために一生懸命勉強しています。" },
    { word: "vehicle", phonetic: "/ˈviːəkəl/", pos: "名詞 (noun)", meaning: "乗り物、車", example: "Many vehicles use electricity instead of gasoline.", exampleJp: "多くの乗り物がガソリンの代わりに電気を使っています。" },
    { word: "recommend", phonetic: "/ˌrekəˈmend/", pos: "動詞 (verb)", meaning: "〜を推薦する、勧める", example: "I recommend this book to all my students.", exampleJp: "私はこの本を全ての生徒に勧めます。" },
    { word: "improve", phonetic: "/ɪmˈpruːv/", pos: "動詞 (verb)", meaning: "〜を改善する、改良する、上達する", example: "She wants to improve her English skills.", exampleJp: "彼女は英語の力を上達させたいと思っています。" },
    { word: "recently", phonetic: "/ˈriːsəntli/", pos: "副詞 (adverb)", meaning: "最近、このごろ", example: "I have been very busy recently.", exampleJp: "私は最近とても忙しいです。" },
    { word: "customer", phonetic: "/ˈkʌstəmər/", pos: "名詞 (noun)", meaning: "顧客、お客様", example: "The store has many regular customers.", exampleJp: "その店には多くの常連客がいます。" },
    { word: "several", phonetic: "/ˈsevrəl/", pos: "形容詞 (adjective)", meaning: "幾つかの、いくらかの", example: "I have visited Kyoto several times.", exampleJp: "私は京都を何度か訪れたことがあります。" },
    { word: "discover", phonetic: "/dɪˈskʌvər/", pos: "動詞 (verb)", meaning: "〜を発見する、見つける", example: "Scientists discovered a new planet.", exampleJp: "科学者たちは新しい惑星を発見しました。" },
    { word: "common", phonetic: "/ˈkɑːmən/", pos: "形容詞 (adjective)", meaning: "共通の、共同の、よくある", example: "Smith is a common last name in England.", exampleJp: "Smithはイギリスでよくある名字です。" },
    { word: "in particular", phonetic: "/ɪn pərˈtɪkjələr/", pos: "熟語 (phrase)", meaning: "特に、とりわけ", example: "I love fruit, in particular apples.", exampleJp: "私は果物が大好きで、特にリンゴが好きです。" },
    { word: "disturb", phonetic: "/dɪˈstɜːrb/", pos: "動詞 (verb)", meaning: "〜を阻害する、(人の)邪魔をする", example: "Please don't disturb me while I'm studying.", exampleJp: "勉強中なので邪魔をしないでください。" },
    { word: "moreover", phonetic: "/mɔːrˈoʊvər/", pos: "副詞 (adverb)", meaning: "さらに、その上", example: "The hotel was beautiful. Moreover, it was very cheap.", exampleJp: "そのホテルは美しかった。その上、とても安かった。" },
    { word: "not only A but also B", phonetic: "/nɑːt ˈoʊnli bʌt ˈɔːlsoʊ/", pos: "接続詞 (conjunction)", meaning: "AだけでなくBもまた、Aと同様Bも", example: "She is not only smart but also kind.", exampleJp: "彼女は賢いだけでなく、親切でもあります。" },
    { word: "a number of", phonetic: "/ə ˈnʌmbər əv/", pos: "熟語 (phrase)", meaning: "たくさんの、多数の", example: "A number of students joined the club.", exampleJp: "多くの生徒がそのクラブに参加しました。" },
    { word: "be likely to", phonetic: "/biː ˈlaɪkli tuː/", pos: "熟語 (phrase)", meaning: "〜する可能性が高い、しそうになる", example: "It is likely to rain this afternoon.", exampleJp: "今日の午後は雨が降る可能性が高いです。" },
    { word: "benefit", phonetic: "/ˈbenɪfɪt/", pos: "名詞・動詞 (noun/verb)", meaning: "利益 / 〜に利益をもたらす", example: "Regular exercise has many benefits for your health.", exampleJp: "定期的な運動は健康に多くの利益があります。" },
    { word: "deal with", phonetic: "/diːl wɪð/", pos: "熟語 (phrase)", meaning: "〜に対処する、対応する", example: "We need to deal with this problem quickly.", exampleJp: "私たちはこの問題に早く対処する必要があります。" },
    { word: "solution", phonetic: "/səˈluːʃən/", pos: "名詞 (noun)", meaning: "解決法、解明", example: "We finally found a solution to the problem.", exampleJp: "私たちはついに問題の解決法を見つけました。" },
    { word: "inform", phonetic: "/ɪnˈfɔːrm/", pos: "動詞 (verb)", meaning: "情報を与える、〜に知らせる", example: "Please inform me when you arrive.", exampleJp: "到着したら私に知らせてください。" },
    { word: "unable", phonetic: "/ʌnˈeɪbəl/", pos: "形容詞 (adjective)", meaning: "できない、不能である", example: "I was unable to attend the meeting yesterday.", exampleJp: "昨日は会議に出席することができませんでした。" },
    { word: "disease", phonetic: "/dɪˈziːz/", pos: "名詞 (noun)", meaning: "病気、疾患", example: "Washing your hands can prevent many diseases.", exampleJp: "手を洗うことで多くの病気を防ぐことができます。" },
    { word: "therefore", phonetic: "/ˈðerfɔːr/", pos: "副詞 (adverb)", meaning: "それゆえ、だから", example: "He was sick. Therefore, he stayed home.", exampleJp: "彼は病気だった。だから家にいた。" },
    { word: "unfortunately", phonetic: "/ʌnˈfɔːrtʃənətli/", pos: "副詞 (adverb)", meaning: "残念なことに、不幸にも", example: "Unfortunately, the concert was canceled.", exampleJp: "残念なことに、コンサートは中止になりました。" }
  ];

  var cards = original.slice();
  var currentIndex = 0;
  var speed = 1.0;
  var englishVoice = null;

  function initVoices() {
    if (typeof speechSynthesis === 'undefined') return;
    var voices = speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return;
    englishVoice = null;
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang === 'en-US' && voices[i].name.indexOf('Google') !== -1) {
        englishVoice = voices[i];
        return;
      }
    }
    for (var j = 0; j < voices.length; j++) {
      if (voices[j].lang === 'en-US') { englishVoice = voices[j]; return; }
    }
    for (var k = 0; k < voices.length; k++) {
      if (voices[k].lang === 'en-GB') { englishVoice = voices[k]; return; }
    }
    for (var l = 0; l < voices.length; l++) {
      if (voices[l].lang && voices[l].lang.indexOf('en') === 0) { englishVoice = voices[l]; return; }
    }
  }

  if (typeof speechSynthesis !== 'undefined') {
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }
    initVoices();
  }

  function renderCard() {
    var c = cards[currentIndex];
    document.getElementById('word').textContent = c.word;
    document.getElementById('phonetic').textContent = c.phonetic;
    document.getElementById('pos').textContent = c.pos;
    document.getElementById('meaning').textContent = c.meaning;
    document.getElementById('example').textContent = c.example;
    document.getElementById('exampleJp').textContent = c.exampleJp;
    document.getElementById('progress').textContent = (currentIndex + 1) + ' / ' + cards.length;
    document.getElementById('progressFill').style.width = Math.round(((currentIndex + 1) / cards.length) * 100) + '%';
    document.getElementById('card').classList.remove('back');
    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex === cards.length - 1;
    updateWordList();
  }

  function flipCard() {
    document.getElementById('card').classList.toggle('back');
  }

  function nextCard() {
    if (currentIndex < cards.length - 1) {
      currentIndex++;
      renderCard();
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      currentIndex--;
      renderCard();
    }
  }

  function speak(text) {
    if (typeof speechSynthesis === 'undefined') {
      alert('お使いのブラウザは音声再生に対応していません');
      return;
    }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = speed;
      if (englishVoice) u.voice = englishVoice;
      speechSynthesis.speak(u);
    } catch (e) {
      console.log('Speech error:', e);
    }
  }

  function shuffle() {
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = cards[i];
      cards[i] = cards[j];
      cards[j] = tmp;
    }
    currentIndex = 0;
    renderCard();
  }

  function resetCards() {
    cards = original.slice();
    currentIndex = 0;
    renderCard();
  }

  function updateWordList() {
    var list = document.getElementById('wordList');
    var html = '';
    for (var i = 0; i < cards.length; i++) {
      html += '<div class="list-item' + (i === currentIndex ? ' current' : '') + '" data-index="' + i + '">';
      html += '<span class="list-num">' + (i + 1) + '.</span>';
      html += '<span class="list-word"></span>';
      html += '<span class="list-meaning"></span>';
      html += '</div>';
    }
    list.innerHTML = html;
    var items = list.getElementsByClassName('list-item');
    for (var k = 0; k < items.length; k++) {
      items[k].getElementsByClassName('list-word')[0].textContent = cards[k].word;
      items[k].getElementsByClassName('list-meaning')[0].textContent = cards[k].meaning;
      (function(idx) {
        items[idx].addEventListener('click', function() {
          currentIndex = idx;
          renderCard();
        });
      })(k);
    }
  }

  document.getElementById('card').addEventListener('click', function(e) {
    var target = e.target;
    while (target && target !== this) {
      if (target.classList && (target.classList.contains('controls') || target.tagName === 'BUTTON' || target.tagName === 'SELECT')) {
        return;
      }
      target = target.parentNode;
    }
    flipCard();
  });

  document.getElementById('playWord').addEventListener('click', function(e) {
    e.stopPropagation();
    speak(cards[currentIndex].word);
  });
  document.getElementById('playExample').addEventListener('click', function(e) {
    e.stopPropagation();
    speak(cards[currentIndex].example);
  });
  document.getElementById('speedSelect').addEventListener('change', function() {
    speed = parseFloat(this.value);
  });
  document.getElementById('speedSelect').addEventListener('click', function(e) {
    e.stopPropagation();
  });
  document.getElementById('prevBtn').addEventListener('click', prevCard);
  document.getElementById('nextBtn').addEventListener('click', nextCard);
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);
  document.getElementById('resetBtn').addEventListener('click', resetCards);
  document.getElementById('listToggle').addEventListener('click', function() {
    document.getElementById('wordList').classList.toggle('show');
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') nextCard();
    else if (e.key === 'ArrowLeft') prevCard();
    else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  });

  renderCard();
})();
</script>
</body>
</html>
